openapi: 3.0.3
info:
  title: Rigging Rentals API
  version: 1.0.0
  description: 'REST API for the Rigging Rentals equipment-hire platform (Spring Boot backend, React frontend).


    Flow: enquiry → quote (Sales Draft) → accept = order → pick & dispatch → delivery/pickup → return QC → Finance Desk (modify,
    return, zero, tax, approve) → send → payment → Xero. Documents are stored in SharePoint.


    Conventions: JSON camelCase; money as strings with 2 decimals; ISO-8601 dates; organization taken from the JWT; workflow
    changes via POST /{resource}/{id}/{action}; optimistic locking with If-Match; errors as RFC 7807.'
servers:
- url: https://api.riggingrentals.com.au/api/v1
  description: Production
- url: https://staging-api.riggingrentals.com.au/api/v1
  description: Staging
- url: http://localhost:8080/api/v1
  description: Local
security:
- bearerAuth: []
tags:
- name: auth
  description: Login, refresh, current user
- name: admin
  description: Organizations (tenants), users, roles, privileges, parameters, stages
- name: sales
  description: Customers, enquiries, quotes (Sales Draft stage)
- name: orders
  description: 'Hire orders: pick, dispatch, off-rent, return QC, audits'
- name: inventory
  description: Categories, models (SKUs), instruments, certificates, hidden charges, availability
- name: workshop
  description: Workshop queues, work orders, logistics
- name: finance
  description: 'Finance Desk: invoices, adjustments, tax, zero, approve, payments, Xero'
- name: documents
  description: Document storage in SharePoint (Microsoft Graph)
- name: dashboard
  description: Command center metrics
paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: Sign in
      operationId: postAuthLogin
      description: Resolves the tenant by companyCode, then (organizationId, email). Sets the refresh-token cookie. Locked
        accounts return 423.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/E400'
        '404':
          $ref: '#/components/responses/E404'
        '423':
          $ref: '#/components/responses/E423'
      security: []
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Get a new access token from the refresh cookie
      operationId: postAuthRefresh
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/E400'
        '404':
          $ref: '#/components/responses/E404'
      security: []
  /auth/logout:
    post:
      tags:
      - auth
      summary: Revoke the refresh token
      operationId: postAuthLogout
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /me:
    get:
      tags:
      - auth
      summary: Current user, roles, privileges (ACTION/MENU/FIELD) and effective parameters
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /platform/organizations:
    get:
      tags:
      - admin
      summary: List tenants
      operationId: getPlatformOrganizations
      description: 'Required privilege: `SUPER_ADMIN`'
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    content:
                      type: array
                      items:
                        $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    post:
      tags:
      - admin
      summary: Create tenant (clones default roles and stages)
      operationId: postPlatformOrganizations
      description: 'Required privilege: `SUPER_ADMIN`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /platform/organizations/{id}:
    get:
      tags:
      - admin
      summary: Get tenant
      operationId: getPlatformOrganizationsId
      description: 'Required privilege: `SUPER_ADMIN`'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    patch:
      tags:
      - admin
      summary: Update / disable tenant
      operationId: patchPlatformOrganizationsId
      description: 'Required privilege: `SUPER_ADMIN`'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /organization:
    get:
      tags:
      - admin
      summary: Own organization profile
      operationId: getOrganization
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    patch:
      tags:
      - admin
      summary: Update own organization profile
      operationId: patchOrganization
      description: 'Required privilege: `ORG_ADMIN`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /organization/logo:
    get:
      tags:
      - admin
      summary: Tenant logo
      operationId: getOrganizationLogo
      responses:
        '200':
          description: OK
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    put:
      tags:
      - admin
      summary: Upload tenant logo (PNG/JPG, max 1 MB)
      operationId: putOrganizationLogo
      description: 'Required privilege: `ORG_ADMIN`'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '413':
          $ref: '#/components/responses/E413'
        '415':
          $ref: '#/components/responses/E415'
  /users:
    get:
      tags:
      - admin
      summary: List users
      operationId: getUsers
      description: 'Required privilege: `ORG_ADMIN`'
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - $ref: '#/components/parameters/sort'
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: roleId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    content:
                      type: array
                      items:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    post:
      tags:
      - admin
      summary: Create user
      operationId: postUsers
      description: 'Required privilege: `ORG_ADMIN`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /users/{id}:
    get:
      tags:
      - admin
      summary: Get user
      operationId: getUsersId
      description: 'Required privilege: `ORG_ADMIN`'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    patch:
      tags:
      - admin
      summary: Update user / enable / disable
      operationId: patchUsersId
      description: 'Required privilege: `ORG_ADMIN`'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /users/{id}/roles:
    put:
      tags:
      - admin
      summary: Replace a user's roles
      operationId: putUsersIdRoles
      description: 'Required privilege: `ORG_ADMIN`'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdList'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /users/{id}/unlock:
    post:
      tags:
      - admin
      summary: Clear locked flag and failed attempts
      operationId: postUsersIdUnlock
      description: 'Required privilege: `ORG_ADMIN`'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /roles:
    get:
      tags:
      - admin
      summary: List roles (tenant + system) with privileges
      operationId: getRoles
      description: 'Required privilege: `ORG_ADMIN`'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    post:
      tags:
      - admin
      summary: Create tenant role
      operationId: postRoles
      description: 'Required privilege: `ORG_ADMIN`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /roles/{id}:
    get:
      tags:
      - admin
      summary: Get role
      operationId: getRolesId
      description: 'Required privilege: `ORG_ADMIN`'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    patch:
      tags:
      - admin
      summary: Update tenant role (system roles are read-only)
      operationId: patchRolesId
      description: 'Required privilege: `ORG_ADMIN`'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    delete:
      tags:
      - admin
      summary: Delete tenant role (fails if users still hold it)
      operationId: deleteRolesId
      description: 'Required privilege: `ORG_ADMIN`'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /roles/{id}/privileges:
    put:
      tags:
      - admin
      summary: Replace a role's privileges
      operationId: putRolesIdPrivileges
      description: 'Required privilege: `ORG_ADMIN`'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdList'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /privileges:
    get:
      tags:
      - admin
      summary: Shared privilege catalog
      operationId: getPrivileges
      description: 'Required privilege: `ORG_ADMIN`'
      parameters:
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PrivilegeType'
      - name: domain
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Privilege'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /parameters:
    get:
      tags:
      - admin
      summary: Effective parameters (platform default or org override)
      operationId: getParameters
      description: 'Required privilege: `ORG_ADMIN`'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parameter'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /parameters/{paramName}:
    put:
      tags:
      - admin
      summary: Set org override (403 if not org_editable)
      operationId: putParametersParamName
      description: 'Required privilege: `ORG_ADMIN`'
      parameters:
      - name: paramName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParameterValue'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parameter'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    delete:
      tags:
      - admin
      summary: Remove org override (falls back to platform default)
      operationId: deleteParametersParamName
      description: 'Required privilege: `ORG_ADMIN`'
      parameters:
      - name: paramName
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /platform/parameters:
    get:
      tags:
      - admin
      summary: Platform defaults
      operationId: getPlatformParameters
      description: 'Required privilege: `SUPER_ADMIN`'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parameter'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /platform/parameters/{paramName}:
    put:
      tags:
      - admin
      summary: Set platform default and org_editable flag
      operationId: putPlatformParametersParamName
      description: 'Required privilege: `SUPER_ADMIN`'
      parameters:
      - name: paramName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformParameterInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parameter'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /stages:
    get:
      tags:
      - admin
      summary: Ordered stages for an entity, with record counts
      operationId: getStages
      parameters:
      - name: entityType
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/StageEntityType'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    post:
      tags:
      - admin
      summary: Create stage
      operationId: postStages
      description: 'Required privilege: `ORG_ADMIN`'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageInput'
      responses:
        '201':
          description: Created
          content:
