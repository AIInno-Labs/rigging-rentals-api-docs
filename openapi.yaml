      - OTHER
    StorageStatus:
      type: string
      enum:
      - PENDING
      - STORED
      - FAILED
      - DELETED
    PrivilegeType:
      type: string
      enum:
      - ACTION
      - MENU
      - FIELD
    AccessMode:
      type: string
      enum:
      - READ
      - WRITE
      - HIDDEN
    ParamType:
      type: string
      enum:
      - STRING
      - INT
      - DECIMAL
      - BOOLEAN
      - JSON
      - UUID
    AuthProvider:
      type: string
      enum:
      - LOCAL
      - GOOGLE
      - MICROSOFT
    AuditEventType:
      type: string
      enum:
      - CREATED
      - FIELD_CHANGED
      - LINE_ADDED
      - LINE_CHANGED
      - LINE_REMOVED
      - RATE_OVERRIDDEN
      - STAGE_CHANGED
      - TNC_ACCEPTED
      - ASSET_ASSIGNED
      - ASSET_UNASSIGNED
      - DISPATCHED
      - OFF_RENT
      - RETURN_QC
      - CHARGE_APPLIED
      - DOCUMENT_ADDED
      - DOCUMENT_REMOVED
      - NOTE_UPDATED
      - LOGISTICS_UPDATED
      - INVOICE_CREATED
      - INVOICE_ADJUSTED
      - CANCELLED
    LogisticsType:
      type: string
      enum:
      - DELIVERY
      - PICKUP
    ReturnToRole:
      type: string
      enum:
      - SALES
      - WORKSHOP
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        code:
          type: string
          example: CUSTOMER_ON_STOP
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      description: RFC 7807 error body
    Reason:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
      required:
      - reason
    StageRef:
      type: object
      properties:
        stageId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    UserRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
