components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
    size:
      name: size
      in: query
      schema:
        type: integer
        format: int32
        default: 25
        maximum: 200
    sort:
      name: sort
      in: query
      schema:
        type: string
      example: createdAt,desc
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: Record version / ETag for optimistic locking
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Repeat-safe key for send, payment, dispatch, accept
  responses:
    E400:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    E401:
      description: Not authenticated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    E403:
      description: Missing privilege or FIELD_READ_ONLY
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    E404:
      description: Not found (or other tenant's record)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    E409:
      description: Version conflict or duplicate
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    E413:
      description: FILE_TOO_LARGE
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    E415:
      description: UNSUPPORTED_MEDIA_TYPE
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    E422:
      description: Business rule failed (wrong stage, on stop, cert expired, not enough stock, document required)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    E423:
      description: Account locked
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    E502:
      description: STORAGE_UNAVAILABLE (SharePoint / Microsoft Graph)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    PaymentType:
      type: string
      enum:
      - CASH
      - CREDIT
    InquiryStage:
      type: string
      enum:
      - NEW
      - QUALIFIED
      - QUOTED
      - LOST
    QuoteStage:
      type: string
      enum:
      - DRAFT
      - SENT
      - ACCEPTED
      - CONVERTED
      - EXPIRED
      - CANCELLED
    OrderStage:
      type: string
      enum:
      - CONFIRMED
      - PRE_PICK
      - DISPATCHED
      - OFF_RENT_PENDING
      - RETURNED
      - INVOICED
      - CLOSED
      - CANCELLED
    InvoiceStage:
      type: string
      enum:
      - DRAFT
      - RETURNED
      - APPROVED
      - SENT
      - PARTIALLY_PAID
      - PAID
      - VOID
    InvoiceBucket:
      type: string
      enum:
      - needs_approve
      - returned
      - needs_send
      - awaiting
      - overdue
      - needs_xero
      - paid
    WorkOrderStage:
      type: string
      enum:
      - OPEN
      - IN_PROGRESS
      - WAITING_PARTS
      - COMPLETED
    LogisticsStage:
      type: string
      enum:
      - SCHEDULED
      - EN_ROUTE
      - COMPLETED
      - CANCELLED
    InstrumentStatus:
      type: string
      enum:
      - AVAILABLE
      - RESERVED
      - ON_HIRE
      - IN_INSPECTION
      - MAINTENANCE
      - RETIRED
    TncVia:
